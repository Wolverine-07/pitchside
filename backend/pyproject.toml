[project]
name = "pitchside"
version = "0.1.0"
description = "Multi-agent match intelligence for synthetic football events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-foundry>=1.15.0",
    "agent-framework-openai>=1.17.0",
    "agent-framework-orchestrations>=1.4.0",
    "azure-identity>=1.26.0",
    "fastapi>=0.115",
    "mcp>=2.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitchside"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
